spring:
  application.name: silicocare-backend
  # Biến môi trường thật luôn được ưu tiên; file .env (không commit) chỉ để tiện khi chạy local.
  config.import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/silicocare}
    username: ${DB_USER:silicocare}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      # Đặt sẵn tên EHLO và mail.from (dùng sinh Message-ID) để JavaMail không tra cứu ngược tên máy
      # — trên một số máy Windows bước đó mất ~15 giây.
      mail.smtp.localhost: ${MAIL_EHLO_NAME:localhost}
      mail.from: ${app.mail.from}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  mail:
    from: ${MAIL_FROM:SilicoCare <no-reply@silicocare.local>}

springdoc:
  swagger-ui.path: /swagger-ui.html
